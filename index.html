<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estudio Viral IA</title>
<meta name="description" content="Creá videos virales con IA gratis: desde texto, guion, link de YouTube/TikTok, audio, imágenes o música.">
<meta name="theme-color" content="#0F0F12">
<script type="importmap">{"imports":{"onnxruntime-web":"https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/esm/ort.min.js"}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F0F12;--bg2:#141419;--panel:#18181f;--panel2:#1f1f29;--line:#272733;--line2:#353545;
  --txt:#ededf5;--mut:#9b9bb2;--dim:#6c6c84;
  --acc:#7c5cff;--acc2:#a78bfa;--accbg:rgba(124,92,255,.14);
  --neo:#22d3ee;--lime:#39ff88;
  --ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--yel:#ffe14d;--r:12px;--sb:226px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
a{color:var(--acc2)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}

.app{display:flex;min-height:100vh}
.sb{width:var(--sb);background:var(--bg2);border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:16px 12px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:800;font-size:16px;letter-spacing:-.2px}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#7c5cff,#22d3ee);display:grid;place-items:center;box-shadow:0 6px 20px rgba(124,92,255,.35);flex:none}
.logo svg{width:18px;height:18px;stroke:#fff}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--mut)}
.newbtn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--acc);color:#fff;border-radius:10px;padding:10px;font-weight:600;margin-bottom:14px}
.newbtn:hover{background:#6d4cf0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--mut);font-weight:500;text-align:left}
.nav button:hover{background:var(--panel);color:var(--txt)}
.nav button.on{background:var(--accbg);color:#fff}
.nav button.on svg{color:var(--neo)}
.sbfoot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.credit{background:linear-gradient(135deg,rgba(124,92,255,.18),rgba(34,211,238,.08));border:1px solid rgba(124,92,255,.3);border-radius:10px;padding:10px 12px;font-size:12px}
.credit b{display:block;font-size:13px;margin-top:2px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lime);margin-right:6px;box-shadow:0 0 8px var(--lime)}
.dot.off{background:var(--warn);box-shadow:none}
.main{margin-left:var(--sb);flex:1;min-width:0;padding:24px 28px 120px}
.h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.sub{color:var(--mut);font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:9px;background:var(--panel2);border:1px solid var(--line2);font-weight:600;font-size:13px;transition:.15s;white-space:nowrap;text-decoration:none;color:var(--txt)}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:#6d4cf0}
.btn.grad{background:linear-gradient(135deg,#7c5cff,#b14cff);border:0;color:#fff;box-shadow:0 8px 24px rgba(124,92,255,.3)}
.btn.neo{border-color:rgba(34,211,238,.5);color:var(--neo)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.xs{padding:4px 8px;font-size:11.5px;border-radius:7px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.inp,.ta,.sel{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:9px;padding:9px 11px;outline:none;transition:.15s}
.sel{padding:8px 10px}
.inp:focus,.ta:focus,.sel:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
.ta{resize:vertical;min-height:90px;line-height:1.55}
.lbl{font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 6px;display:flex;align-items:center;gap:6px}
.hint{font-size:12px;color:var(--dim);margin-top:6px}
.info{display:flex;gap:8px;align-items:flex-start;background:var(--accbg);border:1px solid rgba(124,92,255,.3);border-radius:9px;padding:9px 12px;font-size:12.5px;color:#d6ccff;margin-top:10px}
.warnbox{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.35);color:#fde3a7}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);font-size:12.5px;font-weight:500;color:var(--mut);white-space:nowrap}
.chip:hover{color:var(--txt);border-color:var(--acc)}
.chip.on{background:var(--accbg);border-color:var(--acc);color:#fff}
.chip.sm{padding:3px 9px;font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line2);color:var(--mut);white-space:nowrap}
.tag.acc{background:var(--accbg);border-color:rgba(124,92,255,.4);color:var(--acc2)}
.tag.neo{border-color:rgba(34,211,238,.4);color:var(--neo);background:rgba(34,211,238,.08)}
.tag.soon{border-color:rgba(245,158,11,.4);color:var(--warn)}

/* proyectos */
.toolbar{display:flex;gap:10px;margin:18px 0 12px;flex-wrap:wrap}
.search{flex:1;min-width:200px;position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim)}
.search input{padding-left:36px}
.tabs{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--line);padding:4px;border-radius:10px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{padding:7px 13px;border-radius:7px;color:var(--mut);font-weight:600;font-size:12.5px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.tabs button.on{background:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-top:16px}
.pcard{overflow:hidden;transition:.15s}
.pcard:hover{border-color:var(--line2);transform:translateY(-2px)}
.pthumb{aspect-ratio:4/5;position:relative;overflow:hidden;cursor:pointer}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pthumb .cap{position:absolute;left:0;right:0;bottom:10px;text-align:center;font:900 22px Montserrat,sans-serif;color:var(--yel);text-transform:uppercase;-webkit-text-stroke:1.5px #000;text-shadow:0 3px 0 #000;padding:0 8px}
.pthumb .st{position:absolute;top:8px;left:8px}
.badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:rgba(34,197,94,.92);color:#04210f}
.badge.draft{background:rgba(245,158,11,.92);color:#2a1800}
.pbody{padding:10px 11px 11px}
.pbody h4{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{font-size:11px;color:var(--dim);margin:2px 0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pact{display:flex;gap:6px}.pact .btn{flex:1}.pact .ic{flex:none;padding:6px 8px}
.empty{text-align:center;padding:56px 20px;color:var(--mut)}
.empty .big{width:64px;height:64px;border-radius:18px;background:var(--accbg);display:grid;place-items:center;margin:0 auto 14px;color:var(--acc2)}
.empty .big svg{width:30px;height:30px}

/* asistente de creación */
.steps{display:flex;align-items:center;margin:20px 0 24px;max-width:860px}
.step{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);font-weight:600;white-space:nowrap}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);font-size:11px}
.step.on{color:#fff}.step.on .n{background:var(--acc);border-color:var(--acc)}
.step.done{color:var(--acc2)}.step.done .n{background:var(--accbg);border-color:var(--acc)}
.sline{flex:1;height:2px;background:var(--line);margin:0 10px;min-width:14px}.sline.on{background:var(--acc)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;max-width:980px}
.mode{display:flex;align-items:center;gap:14px;padding:15px 16px;text-align:left;transition:.15s}
.mode:hover{border-color:var(--acc);background:var(--panel2)}
.mode.soon{opacity:.55;cursor:not-allowed}
.mode .mi{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:none}
.mode h3{font-size:14.5px;font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mode p{font-size:12px;color:var(--mut)}
.formats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:900px}
.fmt{height:200px;border-radius:14px;border:1px solid var(--line2);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:.2s;background:radial-gradient(ellipse at 50% 120%,rgba(124,92,255,.45),transparent 60%),linear-gradient(160deg,#151030,#0b0b14)}
.fmt:hover,.fmt.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
.fmt .dev{border:2px solid rgba(255,255,255,.6);border-radius:8px;background:rgba(124,92,255,.15);margin-bottom:8px}
.fmt h3{font-size:15px;font-weight:800}.fmt p{font-size:12px;color:var(--mut)}

/* catálogo de estilos */
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.scard{text-align:left;overflow:hidden;transition:.15s;padding:0}
.scard:hover{border-color:var(--line2);transform:translateY(-2px)}
.scard.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.sthumb{aspect-ratio:1/1;position:relative;display:grid;place-items:center;overflow:hidden}
.sthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.sthumb img.ld{opacity:1}
.scard:hover .sthumb img,.scard.on .sthumb img{animation:kb 5s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.2) translate(-5%,-4%)}}
.sthumb.fx-vhs::after,.sthumb.fx-film16::after,.sthumb.fx-super8::after,.sthumb.fx-mudo::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.sthumb .ini{font:900 30px Montserrat;color:rgba(255,255,255,.85);text-shadow:0 2px 12px rgba(0,0,0,.4)}
.sthumb .pv{position:absolute;right:6px;bottom:6px;font-size:10px;background:rgba(0,0,0,.65);padding:2px 6px;border-radius:5px;color:#fff;z-index:2}
.scard .sb2{padding:9px 10px 11px}
.scard h4{font-size:12.5px;font-weight:700}
.scard p{font-size:11px;color:var(--mut);line-height:1.35;margin-top:2px}
.catsec{margin:22px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.catsec h3{font-size:15px;font-weight:800}
.catsec span{font-size:12px;color:var(--dim)}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.gcard{padding:14px;text-align:left;transition:.15s;display:flex;flex-direction:column;gap:8px}
.gcard:hover{border-color:var(--acc)}
.gcard.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.gcard h4{font-size:14px;display:flex;gap:8px;align-items:center}
.gcard .e{font-size:22px}
.gcard p{font-size:12px;color:var(--mut)}
.pagehead{padding:22px 24px;border-radius:16px;background:radial-gradient(ellipse at 100% 0,rgba(34,211,238,.18),transparent 55%),radial-gradient(ellipse at 0 100%,rgba(124,92,255,.25),transparent 60%),var(--panel);border:1px solid var(--line);margin-bottom:16px}
.pagehead .h1{font-size:26px}

/* editor */
.ehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ehead .ttl{display:flex;flex-direction:column;min-width:0;flex:1}
.ttlin{background:transparent;border:1px solid transparent;border-radius:7px;padding:2px 6px;font-weight:800;font-size:18px;max-width:420px;min-width:0;outline:none}
.ttlin:hover,.ttlin:focus{border-color:var(--line2)}
.savest{font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:5px;white-space:nowrap}
.savest svg{width:14px;height:14px}
.savest.ok{color:var(--lime)}
.cred{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:7px 11px;border-radius:9px;border:1px solid rgba(57,255,136,.3);color:var(--lime);background:rgba(57,255,136,.06);white-space:nowrap}
.cred.off{border-color:rgba(245,158,11,.35);color:var(--warn);background:rgba(245,158,11,.06)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#7c5cff);display:grid;place-items:center;font-weight:800;color:#fff;position:relative}
.umenu{position:absolute;right:0;top:42px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:6px;z-index:40;min-width:190px;display:none;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.umenu.open{display:block}
.umenu button{display:flex;gap:8px;align-items:center;width:100%;padding:8px 10px;border-radius:7px;font-size:13px;color:var(--txt);text-align:left;font-weight:500}
.umenu button:hover{background:var(--accbg)}
.pipe{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.pstep{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--dim)}
.pstep svg{width:14px;height:14px}
.pstep.ok{color:var(--lime);border-color:rgba(57,255,136,.35)}
.pstep.run{color:var(--neo);border-color:var(--neo)}
.ed{display:grid;grid-template-columns:270px minmax(0,1fr) 320px;grid-template-areas:"left center right" "tl tl tl";gap:16px;align-items:start}
.ed.noleft{grid-template-columns:0 minmax(0,1fr) 320px}
.ed.noleft .left{display:none}
.left{grid-area:left;display:flex;flex-direction:column;gap:10px;position:sticky;top:14px;max-height:calc(100vh - 200px);overflow-y:auto;padding-right:2px}
.center{grid-area:center;min-width:0}
.right{grid-area:right;display:flex;flex-direction:column;gap:12px;position:sticky;top:14px;max-height:calc(100vh - 200px);overflow-y:auto}
.tlwrap{grid-area:tl;position:sticky;bottom:0;z-index:15;background:rgba(15,15,18,.94);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
details.pnl{background:var(--panel);border:1px solid var(--line);border-radius:12px}
details.pnl>summary{list-style:none;cursor:pointer;padding:11px 13px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px}
details.pnl>summary::-webkit-details-marker{display:none}
details.pnl>summary::after{content:"▾";margin-left:auto;color:var(--dim);transition:.2s}
details.pnl:not([open])>summary::after{transform:rotate(-90deg)}
details.pnl>summary svg{color:var(--neo)}
.pbody2{padding:0 13px 13px}
.seg{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--line);padding:3px;border-radius:9px}
.seg button{flex:1;padding:6px 4px;border-radius:6px;font-size:11.5px;font-weight:600;color:var(--mut);white-space:nowrap}
.seg button.on{background:var(--acc);color:#fff}
.cstyle{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;background:var(--bg2);border:1px solid var(--line2);cursor:pointer;text-align:left;width:100%}
.cstyle:hover{border-color:var(--acc)}
.cstyle .sw2{width:44px;height:44px;border-radius:8px;flex:none;overflow:hidden;position:relative}
.cstyle .sw2 img{width:100%;height:100%;object-fit:cover;opacity:0}
.cstyle .sw2 img.ld{opacity:1}
.cstyle b{font-size:13px;display:block}.cstyle small{font-size:11px;color:var(--mut)}
.etabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.etabs button{padding:9px 13px;font-weight:600;font-size:13px;color:var(--mut);display:flex;align-items:center;gap:7px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.etabs button.on{color:#fff;border-color:var(--neo)}
.box{padding:16px;margin-bottom:14px}
.box h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.colh{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);margin:12px 0 6px;display:flex;align-items:center;gap:6px}
.colh.acc{color:var(--neo)}
input[type=range]{width:100%;accent-color:var(--acc)}
.rlabels{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.genbtn{display:flex;justify-content:center;margin:16px 0 4px}
.genbtn .btn{padding:13px 28px;font-size:15px;border-radius:12px}
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-top:12px}
.scene{display:grid;grid-template-columns:92px 1fr;gap:11px;padding:10px;background:var(--bg2);cursor:pointer;transition:.15s}
.scene.sel{border-color:var(--neo);box-shadow:0 0 0 1px var(--neo)}
.simg{width:92px;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,#251b52,#14141f);position:relative;display:grid;place-items:center;color:var(--dim);align-self:start}
.simg.v{aspect-ratio:9/16}.simg.h{aspect-ratio:16/9}.simg.c{aspect-ratio:1/1}
.simg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.simg .num{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.7);font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;color:#fff;z-index:2}
.simg .bdg{position:absolute;bottom:4px;left:4px;right:4px;display:flex;gap:3px;flex-wrap:wrap;z-index:2}
.simg .bdg span{font-size:8.5px;background:rgba(0,0,0,.7);color:var(--neo);padding:0 4px;border-radius:4px}
.spin{width:18px;height:18px;border:2px solid var(--line2);border-top-color:var(--neo);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.scene .ta{min-height:54px;font-size:12.5px;padding:7px 9px}
.scene .pr{font-size:11px;min-height:42px;color:var(--mut);margin-top:6px}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px}
.vcard{padding:12px;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;transition:.15s}
.vcard.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none}
.vcard h4{font-size:13px}.vcard p{font-size:11.5px;color:var(--mut)}
.vcard .btn{margin-left:auto}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-top:8px}
.opt{padding:11px 8px;text-align:center;font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
.opt.on{border-color:var(--acc);background:var(--accbg)}
.opt .e{font-size:19px;display:block;margin-bottom:3px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.tog:last-child{border:0}
.sw{width:36px;height:21px;border-radius:99px;background:var(--line2);position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.sw.on{background:var(--acc)}.sw.on::after{left:18px}

/* preview */
.pvbox{padding:12px}
.pvbox h3{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.stage{background:#000;border-radius:10px;overflow:hidden;position:relative;margin:0 auto;display:grid;place-items:center;border:1px solid var(--line2)}
.stage.v{aspect-ratio:9/16;width:100%;max-width:230px}
.stage.h{aspect-ratio:16/9;width:100%}
.stage.c{aspect-ratio:1/1;width:100%;max-width:290px}
.stage canvas,.stage video{width:100%;height:100%;display:block;object-fit:contain}
.stage .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--neo);font-size:11px;padding:20px;background:linear-gradient(180deg,#141432,#0a0a14)}
.stage .fs{position:absolute;right:6px;top:6px;background:rgba(0,0,0,.6);border-radius:7px;padding:5px;color:#fff;z-index:3}
.pctl{display:flex;gap:6px;margin-top:10px}.pctl .btn{flex:1}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c5cff,#22d3ee);transition:width .2s}
.pmsg{font-size:11.5px;color:var(--mut);margin-top:6px;min-height:16px}
.cfg{padding:12px}
.cfg h3{font-size:12px;color:var(--mut);font-weight:600;margin-bottom:6px}
.cfg div{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid var(--line)}
.cfg div:last-child{border:0}
.cfg span:first-child{color:var(--dim)}
.cfg span:last-child{font-weight:600;text-align:right;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scpanel{padding:12px}
.scpanel h3{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:space-between}
.vars{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.vars button{width:52px;height:52px;border-radius:7px;overflow:hidden;flex:none;border:2px solid transparent;background:var(--bg2);position:relative}
.vars button.on{border-color:var(--neo)}
.vars img{width:100%;height:100%;object-fit:cover}
.tools{display:grid;grid-template-columns:1fr;gap:6px;margin-top:8px}
.tools .btn{width:100%;white-space:normal;text-align:left;min-width:0}
.tools-main{display:grid;grid-template-columns:1fr;gap:6px;margin-top:6px}.tools-main .btn{width:100%;justify-content:flex-start;white-space:normal;text-align:left}
.tools .btn{justify-content:flex-start;font-size:11.5px;padding:7px 8px}
.cmp{position:relative;border-radius:8px;overflow:hidden;margin-top:8px;background:#000}
.cmp img{display:block;width:100%}
.cmp .top{position:absolute;inset:0}
.cmp .top img{height:100%;object-fit:cover}
.cmp .lab{position:absolute;top:6px;font-size:10px;background:rgba(0,0,0,.7);padding:1px 6px;border-radius:5px}

/* timeline */
.tlhead{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut);margin-bottom:6px;flex-wrap:wrap}
.tlhead b{color:var(--txt)}
.tl{position:relative;overflow-x:auto}
.tlin{position:relative;min-width:100%}
.trk{display:flex;align-items:stretch;gap:2px;height:40px;margin-bottom:3px}
.trk.thin{height:12px}
.tb{position:relative;border-radius:6px;overflow:hidden;background:var(--panel2);border:1px solid var(--line2);cursor:pointer;min-width:18px;background-size:cover;background-position:center}
.tb.sel{border-color:var(--neo);box-shadow:inset 0 0 0 1px var(--neo)}
.tb span{position:absolute;left:3px;top:2px;font-size:10px;font-weight:700;background:rgba(0,0,0,.7);padding:0 4px;border-radius:4px}
.tv{border-radius:4px;background:rgba(124,92,255,.55)}
.tv.off{background:var(--line)}
.tm{flex:1;border-radius:4px;background:linear-gradient(90deg,rgba(34,211,238,.45),rgba(57,255,136,.35));position:relative;overflow:hidden}
.tm i{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.55)}
.tlab{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim)}
.phd{position:absolute;top:0;bottom:0;width:2px;background:var(--yel);box-shadow:0 0 6px var(--yel);left:0;pointer-events:none;z-index:4;display:none}
.trkl{font-size:10px;color:var(--dim);margin:2px 0}

/* asistente IA */
.fab{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:999px;background:linear-gradient(135deg,#7c5cff,#22d3ee);color:#fff;font-weight:700;box-shadow:0 10px 30px rgba(124,92,255,.45)}
.fab svg{width:20px;height:20px}
.chat{position:fixed;right:20px;bottom:20px;width:390px;max-width:calc(100vw - 24px);height:580px;max-height:calc(100vh - 40px);z-index:70;display:none;flex-direction:column;background:var(--bg2);border:1px solid var(--line2);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden}
.chat.open{display:flex}
.chead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,rgba(124,92,255,.2),rgba(34,211,238,.05))}
.chead b{font-size:14px}.chead small{display:block;font-size:11px;color:var(--mut)}
.chead .x{margin-left:auto;color:var(--mut);padding:4px}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:9px 12px;border-radius:12px;font-size:13px;white-space:pre-wrap;word-wrap:break-word}
.m.u{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
.m.s{align-self:center;font-size:11.5px;color:var(--mut);background:transparent;padding:2px}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}
.sugg button{font-size:11.5px;padding:5px 9px;border-radius:99px;border:1px solid var(--line2);color:var(--mut)}
.sugg button:hover{color:#fff;border-color:var(--acc)}
.cin{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.cin textarea{flex:1;resize:none;height:42px;max-height:120px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:10px;outline:none;font-size:13px}
.cin button{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);flex:none}
.cin button.send{background:var(--acc);border-color:var(--acc);color:#fff}
.cin button.rec{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}

.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:99;background:var(--panel2);border:1px solid var(--line2);padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none;max-width:90vw}
.toast.show{display:block;animation:tin .2s}.toast.err{border-color:var(--bad)}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:90;display:none;place-items:center;padding:20px}
.modal.open{display:grid}
.modal img{max-width:100%;max-height:85vh;border-radius:10px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:80;display:none;padding:24px;overflow-y:auto}
.sheet.open{display:block}
.sheet .inner{max-width:1100px;margin:0 auto;background:var(--bg);border:1px solid var(--line2);border-radius:16px;padding:20px}
.helpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:16px}
.helpgrid .card{padding:16px}
.helpgrid h4{margin-bottom:6px;display:flex;gap:8px;align-items:center}
.helpgrid h4 svg{color:var(--neo)}
.helpgrid p,.helpgrid li{font-size:13px;color:var(--mut)}
.helpgrid ol{padding-left:18px}

.topbar{display:none}.bnav{display:none}
@media (max-width:1280px){.ed{grid-template-columns:240px minmax(0,1fr) 290px}}
@media (max-width:1100px){
  .ed,.ed.noleft{grid-template-columns:minmax(0,1fr) 290px;grid-template-areas:"left right" "center right" "tl tl"}
  .left{position:static;max-height:none;overflow:visible}
  .ed.noleft .left{display:flex}
}
@media (max-width:820px){
  .ed,.ed.noleft{grid-template-columns:minmax(0,1fr);grid-template-areas:"right" "left" "center" "tl"}
  .right{position:static;max-height:none}
  .tlwrap{position:static}
  .stage.v{max-width:210px}
  .formats{grid-template-columns:1fr}
}
@media (max-width:760px){
  .sb{display:none}
  .main{margin-left:0;padding:68px 12px 150px}
  .topbar{display:flex;position:fixed;top:0;left:0;right:0;height:56px;background:rgba(15,15,18,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:30;align-items:center;padding:0 14px;gap:10px}
  .topbar .brand{padding:0;font-size:15px}
  .topbar .btn{margin-left:auto}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(20,20,25,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--dim);padding:4px 0}
  .bnav button.on{color:var(--neo)}
  .bnav button.plus svg{background:var(--acc);color:#fff;border-radius:9px;padding:4px;width:30px;height:30px;margin-top:-4px}
  .fab{bottom:78px;right:14px;padding:12px}.fab span{display:none}
  .chat{right:6px;left:6px;bottom:6px;width:auto;max-width:none;height:calc(100vh - 70px)}
  .cols2{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .styles{grid-template-columns:repeat(2,1fr)}
  .scenes{grid-template-columns:1fr}
  .scene{grid-template-columns:72px 1fr}.simg{width:72px}
  .steps .step span{display:none}
  .h1{font-size:19px}.pagehead .h1{font-size:21px}
  .ehead>.btn.grad{width:100%;order:5}
  .ehead>.btn.neo{order:4;flex:1}
  .ehead>.cred{order:4}
  .ehead .ttl{flex:1 1 calc(100% - 60px)}
  .ttlin{font-size:16px;flex:1;width:auto}
  .sheet{padding:8px}
  .hidem{display:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sb" id="sb"></aside>
  <header class="topbar" id="topbar"></header>
  <main class="main" id="main"></main>
  <nav class="bnav" id="bnav"></nav>
</div>

<button class="fab" id="fab" onclick="Chat.toggle(true)"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg><span>Asistente IA</span></button>
<div class="chat" id="chat">
  <div class="chead">
    <div class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg></div>
    <div><b>Asistente IA</b><small>Dale órdenes con texto o con tu voz</small></div>
    <button class="x" onclick="Chat.toggle(false)"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="sugg" id="sugg"></div>
  <div class="cin">
    <button id="micbtn" title="Hablar" onclick="Chat.mic()"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <textarea id="cmsg" placeholder="Ej: video de terror psicológico de 45 seg, estilo VHS" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();Chat.send()}"></textarea>
    <button class="send" onclick="Chat.send()"><svg class="i" viewBox="0 0 24 24"><path d="M4 12 20 4l-6 16-3-7z"/></svg></button>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal" onclick="this.classList.remove('open')"><img id="modalimg" alt=""></div>
<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="inner" id="sheetin"></div></div>

<script>

const ic=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24">${IC[n]||''}</svg>`;

// ---------------- catálogos ----------------
const STYLE_CATS=[

const Q={tasks:[],running:0,

 next(){const max=S.settings.key?3:1;while(this.tasks.length&&(this.running<max||(this.tasks[0].pri>=9&&this.running<max+1))){const t=this.tasks.shift();this.running++;t.fn().then(t.res,t.rej).finally(()=>{this.running--;this.next()})}}};

function loadImg(url,pri=5){
 if(!url)return Promise.reject(new Error('sin url'));if(imgCache[url])return imgCache[url];
 const once=u=>new Promise((res,rej)=>{u=withKey(u);const im=new Image();im.crossOrigin='anonymous';const to=setTimeout(()=>{im.src='';rej(new Error('tiempo'))},75000);im.onload=()=>{clearTimeout(to);res(im)};im.onerror=()=>{clearTimeout(to);rej(new Error('img'))};im.src=u});

const Ana={
 beats(buf){const d=buf.getChannelData(0),sr=buf.sampleRate,hop=1024,E=[];for(let i=0;i+hop<d.length;i+=hop){let s=0;for(let j=i;j<i+hop;j+=2)s+=d[j]*d[j];E.push(s)}
  const win=Math.round(sr/hop),out=[];let last=-1;for(let i=0;i<E.length;i++){let a=0,n=0;for(let j=Math.max(0,i-win);j<Math.min(E.length,i+win);j++){a+=E[j];n++}a/=n;const t=i*hop/sr;if(E[i]>1.45*a&&E[i]>1e-4&&t-last>.28){out.push(t);last=t}}return out},
 silences(buf){const d=buf.getChannelData(0),sr=buf.sampleRate,w=Math.round(sr*.05),R=[];for(let i=0;i+w<d.length;i+=w){let s=0;for(let j=i;j<i+w;j+=4)s+=d[j]*d[j];R.push(Math.sqrt(s/(w/4)))}
  const mean=R.reduce((a,b)=>a+b,0)/Math.max(1,R.length),thr=Math.max(.004,mean*.28),cuts=[];let st=-1;
  R.forEach((r,i)=>{if(r<thr){if(st<0)st=i}else{if(st>=0&&(i-st)*.05>=.25)cuts.push((st+i)/2*.05);st=-1}});return cuts}
};

Voces (usá el id completo): ${EDGE_VOICES.map(v=>'edge:'+v[0]+'='+v[1]+' ('+v[2]+', '+(v[3]==='F'?'mujer':'hombre')+')').join(', ')}, ${PIPER_VOICES.map(v=>'piper:'+v[0]).join(', ')} · Música: ${MUSIC.map(m=>m.id).join(', ')} · Ambientes por escena: ${Object.keys(AMB).join(', ')}
Reglas: para un video nuevo completo usá new + genre (si aplica) + set de lo pedido + auto. Si pega un link de YouTube/TikTok: new mode url + set sourceUrl + auto. Si sólo pregunta, actions vacío.
Estado actual: ${this.ctx()}`},
 async send(txt){const inp=$('#cmsg');const text=(txt||inp.value).trim();if(!text)return;inp.value='';this.add('u',text);this.add('s','pensando…');
  try{const msgs=[{role:'system',content:this.sys()},...this.hist.filter(h=>h.role!=='s').slice(-10).map(h=>({role:h.role==='u'?'user':'assistant',content:h.text}))];
   const out=await AI.chat(msgs,{temp:.4});let data;try{data=AI.json(out)}catch(e){data={reply:out,actions:[]}}
   this.hist=this.hist.filter(h=>h.role!=='s');this.add('a',data.reply||'Listo.');for(const a of(data.actions||[]))await this.exec(a)}
  catch(e){this.hist=this.hist.filter(h=>h.role!=='s');this.add('a','⚠️ '+e.message)}},
 async exec(a){const need=()=>{if(!S.P)openProject(newProject('idea'))};const n=a.n?a.n-1:-1;
  try{switch(a.do){
   case'new':openProject(newProject(a.mode||'idea'));break;
   case'set':{need();let v=a.value;if(a.field==='voice')v=normVoice(v);if(['duration','ipm','speed','subSize','musicVol','zoom'].includes(a.field))v=Number(v);
    if(['vignette','grain','hook','progress','chroma','shake','pulse','beatSync','sfx','amb'].includes(a.field))v=v===true||v==='true';
    if(a.field in S.P&&!['scenes','id'].includes(a.field)){S.P[a.field]=v;if(a.field==='style'){applyFx(styleOf(v).fx);resetImgs()}if(['customStyle','format','quality'].includes(a.field))resetImgs();save();render()}break}
   case'genre':need();setGenre(a.id,a.sub);break;
   case'look':need();await Pipe.lookAI();break;
   case'fetch':need();await Pipe.fetchSource();break;case'paraphrase':need();await Pipe.paraphrase();break;
   case'scenes':need();await Pipe.makeScenes();break;case'images':need();await Pipe.images();break;case'voices':need();await Pipe.voices();break;
   case'render':need();await Player.run(true);break;case'play':need();await Player.run(false);break;
   case'auto':need();this.add('s','⚙️ Creando todo el video…');await Pipe.auto();break;
   case'improve':need();await Pipe.improveScript(a.instruction);break;
   case'editScene':{const s=S.P?.scenes[n];if(s){if(a.text)s.text=a.text;if(a.cam&&CAMS[a.cam])s.cam=a.cam;if(a.amb&&AMB[a.amb])s.amb=a.amb;save();renderScenesOnly();if(a.prompt&&!s.local){s.prompt=a.prompt;await Pipe.regen(n,{keepSeed:true})}}break}
   case'regen':await Pipe.regen(n);break;case'editImage':await Pipe.editImage(n,a.instruction);break;case'upscale':await Pipe.upscale(n);break;case'expand':await Pipe.expand(n);break;case'parallax':await Pipe.parallax(n);break;
   case'addScene':{need();const s={id:uid(),text:a.text||'',prompt:a.prompt||a.text||'cinematic scene',seed:seed(),cam:'auto',amb:'none'};S.P.scenes.splice(a.after??S.P.scenes.length,0,s);save();renderScenesOnly();await Pipe.regen(S.P.scenes.indexOf(s));break}
   case'deleteScene':if(S.P?.scenes[n]){S.P.scenes.splice(n,1);save();renderScenesOnly()}break;
   case'go':go(a.view);break}}catch(e){this.add('a','⚠️ '+e.message)}}};

Object.assign(AMB,{
  sabana:'🦁 Sabana africana (calor e insectos)',
  ranas:'🐸 Ranas y pantano',
  lechuza:'🦉 Lechuza / búho (noche)',

});
var NEW_AMB={sabana:1,ranas:1,lechuza:1,cigarras:1,monos:1,aves_africa:1};
var ambOrig=ambience;
ambience=function(ac,out,type,st,en,vol){
  if(!NEW_AMB[type])return ambOrig.apply(this,arguments);
  var nodes=[],g=ac.createGain(),R=Math.random;
  g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(vol,st+.6);g.gain.setValueAtTime(vol,Math.max(st+.6,en-.6));g.gain.linearRampToValueAtTime(0,en);g.connect(out);
  function noise(ty,f,q,gain){var s=nsrc(ac),fl=ac.createBiquadFilter();fl.type=ty;fl.frequency.value=f;if(q)fl.Q.value=q;var gg=ac.createGain();gg.gain.value=gain;s.connect(fl).connect(gg).connect(g);s.start(st,R());s.stop(en+.1);nodes.push(s);return{fl:fl,gg:gg}}

  function tone(f,t,d,gain,ty,f2){if(t>en-.05)return;var o=ac.createOscillator(),gg=ac.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d*.85);gg.gain.setValueAtTime(.0001,t);gg.gain.exponentialRampToValueAtTime(gain,t+Math.min(.04,d*.3));gg.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(gg).connect(g);o.start(t);o.stop(t+d+.02);nodes.push(o)}

    o.connect(bp).connect(gg).connect(g);o.start(st);m.start(st);o.stop(en+.1);m.stop(en+.1);nodes.push(o,m)}
  switch(type){
    case'sabana':{var w=noise('lowpass',520,0,.16);lfo(w.gg.gain,.07,.07);buzz(4200,33,.010,.11);
      for(var t=st+1;t<en-1;t+=2.5+R()*4){var f=1800+R()*900;tone(f,t,.18,.06,'sine',f*.7);tone(f*.9,t+.22,.2,.05,'sine',f*.6)}

    case'ranas':{noise('lowpass',350,0,.05);buzz(5000,48,.006,.2);
      for(var t3=st+.2;t3<en-.3;t3+=.35+R()*1.1){var f3=180+R()*260,n=1+Math.floor(R()*3);for(var k=0;k<n;k++)tone(f3,t3+k*.16,.12,.16,'square',f3*.8)}}break;
    case'lechuza':{noise('lowpass',300,0,.06);buzz(4400,26,.004,.13);
      for(var t4=st+.8;t4<en-1.2;t4+=4.5+R()*4){var f4=360+R()*50;tone(f4,t4,.42,.30,'sine',f4*.93);tone(f4*.97,t4+.55,.32,.24,'sine',f4*.9);if(R()<.5){tone(f4,t4+1,.28,.2,'sine',f4*.92);tone(f4,t4+1.35,.45,.26,'sine',f4*.9)}}}break;
    case'cigarras':{noise('highpass',3000,0,.015);buzz(5200,60,.032,.18);buzz(4600,52,.022,.09)}break;
    case'monos':{var w5=noise('bandpass',700,.7,.10);lfo(w5.fl.frequency,.09,200);
      for(var t5=st+.5;t5<en-1;t5+=3+R()*5){var base=380+R()*220,n5=3+Math.floor(R()*4);for(var k5=0;k5<n5;k5++){var tt=t5+k5*.28;tone(base*(1+k5*.12),tt,.24,.09,'sawtooth',base*(1.9+k5*.15))}}
      for(var t6=st+.3;t6<en-.4;t6+=.6+R()*1.5){var f6=2000+R()*2000;tone(f6,t6,.08,.05,'sine',f6*1.4)}}break;
    case'aves_africa':{noise('lowpass',450,0,.05);
      for(var t7=st+.3;t7<en-.4;t7+=.5+R()*1.4){var r=R();if(r<.4){var f7=2400+R()*1500;for(var k7=0;k7<4;k7++)tone(f7*(k7%2?1.12:1),t7+k7*.09,.08,.17,'sine',f7*1.25)}
        else if(r<.7){var f8=900+R()*500;tone(f8,t7,.35,.15,'sine',f8*1.6)}else{var f9=1500+R()*800;tone(f9,t7,.12,.14,'triangle',f9*.6);tone(f9*1.1,t7+.15,.12,.14,'triangle',f9*.65)}}}break;
  }

};

var RULES=[
  ['monos',/\b(monkeys?|monos?|apes?|gorillas?|gorilas?|chimpan\w*)\b/i],
  ['ranas',/\b(frogs?|ranas?|sapos?|swamp|pantano\w*|marsh\w*|ci[eé]naga|lagoon|laguna)\b/i],

  ['cigarras',/\b(cicadas?|cigarras?|chicharras?|siesta|scorching|harsh (hot )?sun|sol abrasador|calor (agobiante|intenso)|heat ?wave|ola de calor|dry,? cracked|tierra seca|sedient\w*)\b/i],
  ['aves_africa',/\b(africa\w*|[aá]frica)\b.*\b(dawn|sunrise|amanecer|birds?|p[aá]jaros|aves)\b|\b(dawn|sunrise|amanecer)\b.*\b(africa\w*|[aá]frica)\b/i]

function guessAmb(txt,cur){txt=String(txt||'');for(var i=0;i<RULES.length;i++){if(RULES[i][1].test(txt)){if(SOFT[cur||'none'])return RULES[i][0];return cur}}return cur}

async function loadSnd(s){if(!s.snd)return null;if(RT.snd[s.snd])return RT.snd[s.snd];var b=await IDB.get(s.snd);if(!b)return null;RT.snd[s.snd]=await decode(b);return RT.snd[s.snd]}
window.ev32Snd={
  async add(i,f){var s=S.P.scenes[i];if(!f||!s)return;if(f.size>40e6){toast('El sonido es muy pesado (máximo 40 MB)',1);return}
    Pipe.setBusy('Cargando tu sonido…');
    try{var key='snd:'+s.id;await IDB.set(key,f);delete RT.snd[key];s.snd=key;s.sndName=f.name||'sonido';if(s.sndVol==null)s.sndVol=.7;await loadSnd(s);save(1);toast('Sonido puesto en la escena '+(i+1)+' ✅')}
    catch(e){toast('No pude leer ese sonido: '+(e.message||e),1)}finally{Pipe.setBusy('')}renderSel();renderScenesOnly(1)},
  remove(i){var s=S.P.scenes[i];if(!s)return;s.snd='';s.sndName='';save(1);renderSel();renderScenesOnly(1)},
  vol(i,v){var s=S.P.scenes[i];if(s){s.sndVol=+v;save()}},
  async listen(i){var s=S.P.scenes[i];var b=await loadSnd(s).catch(function(){return null});if(!b){toast('No encontré el sonido',1);return}var ac=getAC();await ac.resume();var src=ac.createBufferSource(),g=ac.createGain();g.gain.value=s.sndVol==null?.7:s.sndVol;src.buffer=b;src.connect(g).connect(ac.destination);src.start();src.stop(ac.currentTime+Math.min(8,b.duration))},
  all(i){var s=S.P.scenes[i];if(!s||!s.snd)return;var n=0;S.P.scenes.forEach(function(o,k){if(k>i&&!o.snd){o.snd=s.snd;o.sndName=s.sndName;o.sndVol=s.sndVol;n++}});save(1);renderScenesOnly(1);toast(n?'Lo puse también en '+n+' escena(s) siguientes ✅':'Las escenas siguientes ya tienen su sonido')}
};
var sfxOrig=scheduleSfx;
scheduleSfx=function(ac,out,TL,t0){var nodes=sfxOrig.apply(this,arguments)||[];
  try{TL.list.forEach(function(x){var s=x.s,b=s.snd&&RT.snd[s.snd];if(!b)return;var st=t0+x.cut,en=t0+x.end+.3,src=ac.createBufferSource(),g=ac.createGain(),v=s.sndVol==null?.7:s.sndVol;
    src.buffer=b;src.loop=b.duration<(en-st);g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(v,st+.5);g.gain.setValueAtTime(v,Math.max(st+.5,en-.6));g.gain.linearRampToValueAtTime(0,en);
    src.connect(g).connect(out);src.start(st);src.stop(en+.05);nodes.push(src)})}catch(e){console.warn('[v3.32] mi sonido',e)}
  return nodes};

function wavFrom(buf,maxSec){var sr=buf.sampleRate,n=Math.min(buf.length,Math.floor((maxSec||1e9)*sr)),ch=buf.numberOfChannels,m=new Float32Array(n);
  for(var c=0;c<ch;c++){var d=buf.getChannelData(c);for(var i=0;i<n;i++)m[i]+=d[i]/ch}
  var ab=new ArrayBuffer(44+n*2),v=new DataView(ab),p=0;function w(s){for(var i=0;i<s.length;i++)v.setUint8(p++,s.charCodeAt(i))}
  w('RIFF');v.setUint32(p,36+n*2,true);p+=4;w('WAVEfmt ');v.setUint32(p,16,true);p+=4;v.setUint16(p,1,true);p+=2;v.setUint16(p,1,true);p+=2;v.setUint32(p,sr,true);p+=4;v.setUint32(p,sr*2,true);p+=4;v.setUint16(p,2,true);p+=2;v.setUint16(p,16,true);p+=2;w('data');v.setUint32(p,n*2,true);p+=4;
  for(var i=0;i<n;i++){var s=Math.max(-1,Math.min(1,m[i]));v.setInt16(p,s<0?s*32768:s*32767,true);p+=2}return new Blob([ab],{type:'audio/wav'})}
async function imageToVideo(im,sec,W,H){
  var cv=document.createElement('canvas');cv.width=W;cv.height=H;var g=cv.getContext('2d');
  var iw=im.naturalWidth||im.videoWidth||im.width,ih=(im.naturalHeight||im.videoHeight||im.height)*(1-(im._crop||0)),k=Math.max(W/iw,H/ih);
  var types=['video/webm;codecs=vp8','video/webm','video/mp4'],mt=types.find(function(t){return window.MediaRecorder&&MediaRecorder.isTypeSupported(t)})||'';
  var stream=cv.captureStream(25),rec=new MediaRecorder(stream,mt?{mimeType:mt,videoBitsPerSecond:4e6}:{}),chunks=[];rec.ondataavailable=function(e){if(e.data.size)chunks.push(e.data)};
  var t0=performance.now();rec.start(250);
  await new Promise(function(done){(function f(){var t=(performance.now()-t0)/1000,z=1+.03*(t/sec);g.fillStyle='#000';g.fillRect(0,0,W,H);var w=iw*k*z,h=ih*k*z;g.drawImage(im,0,0,iw,ih,(W-w)/2,(H-h)/2,w,h);if(t<sec)requestAnimationFrame(f);else done()})()});
  await new Promise(function(r){rec.onstop=r;rec.stop()});return new Blob(chunks,{type:rec.mimeType||'video/webm'})}
var clientP=null;
function lsClient(){var tok='';try{tok=localStorage.getItem('ev32_hf')||''}catch(e){}
  if(!clientP)clientP=import(GRADIO).then(function(m){return m.Client.connect(LIPSYNC_SPACE,tok?{hf_token:tok}:{}).then(function(c){return{c:c,m:m}})}).catch(function(e){clientP=null;throw e});return clientP}
window.ev32Lip={
  token(){var cur='';try{cur=localStorage.getItem('ev32_hf')||''}catch(e){}var el=document.getElementById('ev32tok');var v=(el&&el.value||'').trim();try{localStorage.setItem('ev32_hf',v)}catch(e){}clientP=null;toast(v?'Token guardado ✅ (más tiempo gratis por día)':'Token borrado')},
  open(i){var s=S.P.scenes[i];window.open('https://huggingface.co/spaces/'+LIPSYNC_SPACE,'_blank');
    var v=RT.voices[s.id];if(v){var a=document.createElement('a');a.href=URL.createObjectURL(wavFrom(v.buf,8));a.download='voz_escena_'+(i+1)+'.wav';a.click()}
    toast('Te bajé la voz de la escena. En la página: subí un video corto del personaje en "Video Control", la voz en "Audio Input" y tocá Submit. Después subí el resultado con "Subir mi video".')},
  async make(i){var P=S.P,s=P.scenes[i];if(!s)return;
    var v=RT.voices[s.id];if(!v||v.text!==s.text){toast('Primero generá la voz de esta escena (botón violeta «Generar voces» o «Oír voz»)',1);return}
    var im=RT.imgs[s.img];var hasClip=!!s.clip;if(!im&&!hasClip){toast('Esta escena todavía no tiene imagen',1);return}
    var dur=v.buf.duration/(v.pre?1:P.speed);
    Pipe.setBusy('Preparando la escena para hacerla hablar…');
    try{
      var vid;if(hasClip){vid=await IDB.get(s.clip)}else{var d=Pipe.dims(),sc=Math.min(1,640/Math.max(d.W,d.H)),W=Math.round(d.W*sc/2)*2,H=Math.round(d.H*sc/2)*2;vid=await imageToVideo(im,Math.min(8,dur)+.4,W,H)}
      var wav=wavFrom(v.buf,8);
      Pipe.setBusy('Conectando con el servicio gratis (LatentSync)… la primera vez puede tardar');
      var o=await lsClient();
      Pipe.setBusy('Moviendo la boca con la voz… (puede tardar 1 a 4 minutos, no cierres la página)');
      var r=await o.c.predict('/generate_lip_sync_video',[o.m.handle_file(vid),o.m.handle_file(wav)]);
      var d0=r&&r.data&&r.data[0],url=d0&&((d0.video&&(d0.video.url||d0.video.path))||d0.url||d0.path||d0);
      if(!url||typeof url!=='string')throw new Error('el servicio no devolvió el video');
      var blob=await fetch(url).then(function(x){if(!x.ok)throw new Error('HTTP '+x.status);return x.blob()});
      Pipe.setBusy('');await Pipe.addClip(i,new File([blob],'habla_escena_'+(i+1)+'.mp4',{type:blob.type||'video/mp4'}));
      toast('¡Listo! El personaje de la escena '+(i+1)+' habla 👄'+(dur>8?' (sincroniza los primeros 8 segundos)':''));
    }catch(e){var m=String(e&&e.message||e);
      toast(/quota|GPU|exceed|limit/i.test(m)?'Se terminó el tiempo gratis de hoy del servicio. Probá mañana o pegá un token gratis de Hugging Face abajo.':'El servicio gratis no respondió ('+m.slice(0,90)+'). Probá en un rato o usá «Hacerlo a mano».',1)}
    finally{Pipe.setBusy('')}}
};

      (s.snd?'<div class="ev32-row"><span class="ev32-name">'+esc(s.sndName||'sonido')+'</span></div><div class="ev32-row"><span class="ev32-mini" style="margin:0">Volumen</span><input type="range" min="0" max="1" step="0.05" value="'+(s.sndVol==null?.7:s.sndVol)+'" oninput="ev32Snd.vol('+i+',this.value)" style="flex:1"></div><div class="ev32-row"><button class="btn xs" onclick="ev32Snd.listen('+i+')">▶ Escuchar</button><button class="btn xs" onclick="ev32Snd.all('+i+')">Usar también en las siguientes</button><button class="btn xs danger" onclick="ev32Snd.remove('+i+')">Quitar</button></div>'
        :'<div class="ev32-row"><label class="btn sm">📂 Subir sonido (MP3/WAV)<input type="file" accept="audio/*" hidden onchange="this.files[0]&&ev32Snd.add('+i+',this.files[0])"></label></div>')+
      '<div class="ev32-mini">Se suma al ambiente automático. Sonidos reales gratis de leones, elefantes o pájaros: <a href="https://pixabay.com/sound-effects/" target="_blank" rel="noopener">Pixabay</a> o <a href="https://freesound.org" target="_blank" rel="noopener">Freesound</a>. Si querés solo tu sonido, poné «Ambiente: Sin ambiente».</div></div>'+
      '<div class="ev32-box"><h4>👄 Hacer hablar al personaje <span class="tag" style="font-size:10px">beta · gratis</span></h4>'+
      '<div class="ev32-row"><button class="btn sm grad" data-busy onclick="ev32Lip.make('+i+')">👄 Hacer hablar con su voz</button><button class="btn xs" onclick="ev32Lip.open('+i+')">Hacerlo a mano</button></div>'+
      '<div class="ev32-mini">Mueve la boca de la persona de esta escena al ritmo de su voz (LatentSync, gratis). Funciona mejor con <b>una cara de frente y grande</b>. Sincroniza hasta <b>8 segundos</b>'+(vd>8?' — esta escena dura '+vd.toFixed(0)+' s: conviene dividirla en dos escenas':'')+'. Tarda de 1 a 4 minutos.</div>'+
      '<details class="ev32-mini"><summary style="cursor:pointer">Más tiempo gratis por día (opcional)</summary>Con una cuenta gratis de huggingface.co sacás un token (Settings → Access Tokens) y lo pegás acá:<div class="ev32-row"><input id="ev32tok" class="inp" style="flex:1;padding:6px 8px" placeholder="hf_..." value="'+esc(tok)+'"><button class="btn xs" onclick="ev32Lip.token()">Guardar</button></div></details></div>';
    tools.parentNode.insertBefore(box,tools.nextSibling);
    if(S.busy)box.querySelectorAll('[data-busy]').forEach(function(b){b.disabled=true});
  }catch(e){console.warn('[v3.32] panel',e)}};

/* =========================================================
   4) REPRODUCTOR SEGURO: no se traba ni queda mudo
   ========================================================= */
function withTimeout(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error('tiempo'))},ms)})])}
function cardFor(i){var d=Pipe.dims(),c=document.createElement('canvas');c.width=640;c.height=Math.round(640*d.H/d.W);var g=c.getContext('2d');var gr=g.createLinearGradient(0,0,c.width,c.height);gr.addColorStop(0,'#1f1f29');gr.addColorStop(1,'#0F0F12');g.fillStyle=gr;g.fillRect(0,0,c.width,c.height);g.fillStyle='#9b9bb2';g.font='600 22px Inter,sans-serif';g.textAlign='center';g.fillText('Escena '+(i+1)+': la imagen no cargó',c.width/2,c.height/2-8);g.font='16px Inter,sans-serif';g.fillText('Tocá la escena y «Nueva imagen»',c.width/2,c.height/2+22);c._ev32=true;return c}
async function healAudio(){try{var ac=getAC();if(ac.state!=='running')await withTimeout(ac.resume(),2000).catch(function(){});var a=ac.currentTime;await sleep(180);
  if(ac.state==='closed'||ac.currentTime===a){try{ac.close()}catch(e){}AC=null;var n=getAC();await n.resume().catch(function(){});console.info('[v3.32] audio reiniciado')}}catch(e){}}
var runOrig=Player.run;
Player.run=async function(record){var self=this,P=S.P;
  if(this.playing||!P||!P.scenes.length)return runOrig.call(this,record);
  try{
    await healAudio();
    // imágenes que faltan: espero un rato y, si no llegan, sigo con un cartel en vez de quedar en negro
    var miss=P.scenes.map(function(s,i){return{s:s,i:i}}).filter(function(o){return !RT.imgs[o.s.img]&&!o.s.clip});
    if(miss.length){Pipe.setBusy('Cargando imágenes…');await Promise.all(miss.map(function(o){if(!o.s.img)o.s.img=Pipe.sceneURL(o.s);return withTimeout(loadImg(o.s.img,9),15000).then(function(){paintScene(o.s)}).catch(function(){})}));Pipe.setBusy('');
      var still=miss.filter(function(o){return !RT.imgs[o.s.img]});still.forEach(function(o){RT.imgs[o.s.img]=cardFor(o.i)});
      if(still.length)toast('Escena(s) '+still.map(function(o){return o.i+1}).join(', ')+' sin imagen: sigo igual. Tocá la escena y «Nueva imagen».',1)}
    // 2.5D que tarda demasiado: lo salteo
    for(var k=0;k<P.scenes.length;k++){var s=P.scenes[k];if(s.parallax&&!RT.fg[s.id]&&RT.imgs[s.img]&&!RT.imgs[s.img]._ev32){try{RT.fg[s.id]=await withTimeout(Roto.cut(RT.imgs[s.img]),20000)}catch(e){s.parallax=false;toast('La escena '+(k+1)+' sigue sin 2.5D (tardó demasiado)')}}}
    // mis sonidos
    for(var j=0;j<P.scenes.length;j++){try{await loadSnd(P.scenes[j])}catch(e){}}
    // aviso de escenas sin voz
    if(P.mode!=='musica'&&!RT.narr){var mute=P.scenes.map(function(s,i){var v=RT.voices[s.id];return s.text&&s.text.trim()&&!(v&&v.text===s.text)?i+1:0}).filter(Boolean);
      if(mute.length&&mute.length<P.scenes.length)toast('Ojo: la(s) escena(s) '+mute.join(', ')+' no tienen voz. Tocá «Generar voces de todas las escenas».',1)}
  }catch(e){console.warn('[v3.32] preparación',e)}
  try{return await runOrig.call(self,record)}catch(e){Pipe.setBusy('');toast('No pude reproducir: '+(e.message||e)+'. Probá cerrar y volver a abrir la página.',1);try{self.stop()}catch(_){}}
};

try{var vozOrig=tVoz;tVoz=function(){var h=vozOrig.apply(this,arguments);return String(h).replace('<span class="tag soon">Próximamente</span>','<span class="tag acc">Nuevo · beta gratis</span>').replace('Sincronizar los labios de un personaje con la voz requiere servidores con GPU pagos.','¡Ya está! Generá las voces, tocá una escena y, en el panel de la derecha, usá <b>«👄 Hacer hablar con su voz»</b>. Sincroniza hasta 8 segundos por escena (LatentSync, gratis).')};
  SOON.forEach(function(x){if(/Lip-sync/.test(x.n))x.d='Nuevo (beta, gratis): en cada escena, «Hacer hablar con su voz».'})}catch(e){}

try{renderSel()}catch(e){}
console.info('[Estudio Viral] v3.32 cargado: sonidos de naturaleza, mi sonido, hacer hablar y reproductor seguro');
